version: '3.8'

services:
  # Main Application
  agentic-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-workflow
    image: sidkid78/agentic-workflow:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Add your environment variables here
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - GITHUB_TOKEN=${GITHUB_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - agentic-network
    volumes:
      # Optional: Mount volumes for persistent data
      - agentic-data:/app/data
      - agentic-logs:/app/logs

  # Optional: Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: agentic-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
  #   networks:
  #     - agentic-network
  #   volumes:
  #     - redis-data:/data

  # Optional: PostgreSQL database (uncomment if needed)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: agentic-postgres
  #   environment:
  #     - POSTGRES_USER=agentic
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
  #     - POSTGRES_DB=agentic
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped
  #   networks:
  #     - agentic-network
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

networks:
  agentic-network:
    driver: bridge

volumes:
  agentic-data:
  agentic-logs:
  # redis-data:
  # postgres-data:

