version: '3.8'

services:
  # Main Application
  agentic-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-workflow
    image: sidkid1978/agentic-workflow:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Required: Gemini API Key (get from https://aistudio.google.com/apikey)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Optional: GitHub Token (get from https://github.com/settings/tokens)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Optional: Application settings
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini-2.5-flash}
      - MAX_CONCURRENT_AGENTS=${MAX_CONCURRENT_AGENTS:-5}
      - DEFAULT_REPO=${DEFAULT_REPO:-https://github.com/sidkid78/diverse.git}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - agentic-network
    volumes:
      # Optional: Mount volumes for persistent data
      - agentic-data:/app/data
      - agentic-logs:/app/logs

  # Optional: Redis for caching (uncomment if needed)
  redis:
    image: redis:7-alpine
    container_name: agentic-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - agentic-network
    volumes:
      - redis-data:/data

  # Optional: PostgreSQL database (uncomment if needed)
  postgres:
    image: postgres:17-alpine
    container_name: agentic-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:postgres}
      - POSTGRES_DB=agentic_workflow
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - agentic-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  agentic-network:
    driver: bridge

volumes:
  agentic-data:
  agentic-logs:
  redis-data:
  postgres-data:

